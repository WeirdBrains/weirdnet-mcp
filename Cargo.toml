[package]
name = "weirdnet-mcp"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
description = "Weirdnet MCP: a transport-agnostic Model Context Protocol (JSON-RPC 2.0) tools server with tool specs, annotations, argument helpers and a stdio-to-HTTP bridge loop (extracted from TAUR)."
authors = ["Michael Christenson II <m3talsmith@gmail.com>"]
license = "BSD-3-Clause"
repository = "https://github.com/WeirdBrains/weirdnet-mcp"
documentation = "https://docs.rs/weirdnet-mcp"
readme = "README.md"
keywords = ["mcp", "json-rpc", "agents", "tools", "weirdnet"]
categories = ["network-programming"]
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
serde_json = "1"
